<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📹 视频播放器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #0b0f15 0%, #1a1f2b 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 960px;
            background: rgba(22, 28, 38, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 28px 28px 32px;
            box-shadow: 0 30px 45px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            border: 1px solid rgba(120, 160, 255, 0.2);
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: #eef3fc;
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 span {
            font-size: 1rem;
            font-weight: 500;
            padding: 2px 12px;
            border-radius: 40px;
            color: white;
            background: linear-gradient(135deg, #3b66f0, #7a4cf0);
            box-shadow: 0 2px 10px rgba(59, 102, 240, 0.4);
        }

        .subhead {
            color: #9aaec9;
            margin-bottom: 26px;
            font-size: 1rem;
            border-left: 4px solid #3b66f0;
            padding-left: 16px;
            background: rgba(59, 102, 240, 0.08);
            border-radius: 0 12px 12px 0;
            line-height: 1.4;
        }

        .video-container {
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 16px 30px -8px #000000cc, 0 0 0 1px #2f3b4e inset;
            aspect-ratio: 16 / 9;
            width: 100%;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: black;
            outline: none;
        }

        @media (max-width: 700px) {
            .card {
                padding: 20px 16px 24px;
                border-radius: 1.6rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .video-container {
                border-radius: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>
            🎬 视频播放器
            <span>内置视频</span>
        </h1>
        <div class="subhead">
            ⚡ 视频已内置，直接点击播放即可。
        </div>

        <div class="video-container">
            <!-- ⬇️ 把下面的 src 改成您的视频文件路径即可 ⬇️ -->
            <video
                id="videoPlayer"
                controls
                playsinline
                preload="metadata"
                src="wx_camera_1795151634412.mp4">
            </video>
        </div>
    </div>
</body>
</html>
